<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <h1>Formulario HTML e processamento externo com PHP</h1>
        <hr>
        <form action="" method="post">
            <div>
                <label for="nome">Nome:</label>
                <input type="text" name="nome" id="nome">
            </div>
            <div>
                <label for="email">E-mail:</label>
                <input type="email" name="email" id="email">
            </div>
            <div>
                <label for="idade">Idade:</label>
                <input type="number" name="idade" id="idade" min="0" max="130">
            </div>
                <p>Interesses:</p>
                <div>
                    
                    <div>
                        <input type="checkbox" name="interesses" id="html">
                        <label for="html">HTML</label>
                    </div>
                    
                    <div>
                        <input type="checkbox" name="interesses" id="css">
                        <label for="css">CSS</label>
                    </div>
                    
                    <div>
                        <input type="checkbox" name="interesses" id="js">
                        <label for="js">JS</label>
                    </div>
                    
                    <div>
                        <input type="checkbox" name="interesses" id="python">
                        <label for="python">PYTHON</label>
                    </div>
                    
                    <div>
                        <input type="checkbox" name="interesses" id="PHP">  
                        <label for="php">PHP</label>
                    </div>
                    
                </div>
        </form>
    </div>

   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>  
</body>
</html>
